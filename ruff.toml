# ruff 配置：只用于 CI / 本地静态检查，不参与运行时，也不引入任何第三方依赖。
# 用法：pip install ruff && ruff check .
#
# 设计取舍：
#  1) 只开「真错」那一档（F + E9），不开 E1/E2/E3/E5 这类纯排版规则——
#     本仓库大量单行工作流字面量（wf_*.py 里的 ComfyUI 节点字典）天然超长，
#     强推排版规则只会制造几百条噪音，反而淹没真问题。
#  2) F401（未使用导入）不判失败：全仓的未使用导入几乎都是**副作用导入**，
#     例如 server.py 顶部预加载 features / router / storyboard，测试里 import app.routes
#     触发路由注册——删掉就改运行时行为了。保留为提示，由 F401 之外的规则守住真错。
#  3) target-version 对齐 requirements.txt 里声明的 Python >= 3.9。

target-version = "py39"
line-length = 120

exclude = [
    "temp",
    "output",
    "data",
    "logs",
    "__pycache__",
    ".git",
    "ui-theme-preview",
    "static",
    "templates",
]

[lint]
select = ["F", "E9"]
ignore = ["F401"]

[lint.per-file-ignores]
# 测试里到处是"导入即注册"的桩导入，另有把模块名当变量用的反射调用
"tests/*" = ["F401", "F811"]
